name: Database rebuild

# The whole migration chain must build the schema from an EMPTY database, every
# rollback script must undo it, and the chain must apply again afterwards. If the
# only place the schema works is where it was patched by hand, the next
# environment cannot exist.

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csp
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d csp"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Apply, roll everything back, apply again
        run: |
          fw() {
            docker run --rm --network host -v "$PWD:/workspace:ro" \
              -e FLYWAY_URL=jdbc:postgresql://localhost:5432/csp \
              -e FLYWAY_USER=ci_admin -e FLYWAY_PASSWORD=ci-only \
              flyway/flyway:11.20 -workingDirectory=/workspace -configFiles=flyway.toml "$@"
          }
          sql() { psql -v ON_ERROR_STOP=1 -h localhost -U ci_admin -d csp "$@"; }

          # csp-infra-postgres creates the login users before any executor runs (Annex J.5.5).
          sql -c "CREATE ROLE concessions_app LOGIN PASSWORD 'ci-only'; CREATE ROLE worker_app LOGIN PASSWORD 'ci-only';"

          fw migrate
          fw migrate | tee second.txt
          grep -q "No migration necessary" second.txt || { echo "second migrate applied changes: not incremental"; exit 1; }

          # The checks of V004 keep an invalid product out of the table (HU-CONCESSIONS-001, scenario 2):
          # each invalid row must be refused by the database. The block leaves no data behind.
          sql <<'SQL'
          DO $$
          BEGIN
            INSERT INTO concessions.product (name, category, price) VALUES ('Popcorn', 'SNACK', 0);
            BEGIN  -- a blank name
              INSERT INTO concessions.product (name, category, price) VALUES ('   ', 'SNACK', 100);
              RAISE EXCEPTION 'a blank name was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a negative price
              INSERT INTO concessions.product (name, category, price) VALUES ('Soda', 'DRINK', -1);
              RAISE EXCEPTION 'a negative price was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a negative stock
              INSERT INTO concessions.product (name, category, price, available_stock) VALUES ('Soda', 'DRINK', 1, -1);
              RAISE EXCEPTION 'a negative stock was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a status outside the lifecycle
              INSERT INTO concessions.product (name, category, price, status) VALUES ('Soda', 'DRINK', 1, 'ACTIVE');
              RAISE EXCEPTION 'an unknown status was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- the same name, in another case, among active rows
              INSERT INTO concessions.product (name, category, price) VALUES ('POPCORN', 'SNACK', 100);
              RAISE EXCEPTION 'a duplicated active name was accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            UPDATE concessions.product SET status = 'INACTIVE' WHERE name = 'Popcorn';
            INSERT INTO concessions.product (name, category, price) VALUES ('Popcorn', 'SNACK', 100);  -- allowed once the first is INACTIVE
            BEGIN  -- a key that points to no product, and a key shorter than 8 characters
              INSERT INTO concessions.product_idempotency_key (key, product_id, request_hash)
                VALUES ('0123456789', gen_random_uuid(), 'h');
              RAISE EXCEPTION 'a key of a product that does not exist was accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO concessions.product_idempotency_key (key, product_id, request_hash)
                SELECT 'short', id, 'h' FROM concessions.product LIMIT 1;
              RAISE EXCEPTION 'a key shorter than 8 characters was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            DELETE FROM concessions.product WHERE lower(name) = 'popcorn';
          END
          $$;
          SQL

          # The checks, keys and foreign keys of V006 to V009 (HU-CONCESSIONS-002): each invalid row is refused.
          sql <<'SQL'
          DO $$
          DECLARE p uuid; c uuid;
          BEGIN
            INSERT INTO concessions.product (name, category, price) VALUES ('Combo base', 'SNACK', 10) RETURNING id INTO p;
            INSERT INTO concessions.combo (name, price) VALUES ('Family', 0) RETURNING id INTO c;
            INSERT INTO concessions.combo_item (combo_id, product_id, quantity) VALUES (c, p, 2);
            BEGIN  -- a blank name
              INSERT INTO concessions.combo (name, price) VALUES ('  ', 1);
              RAISE EXCEPTION 'a blank combo name was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a negative price
              INSERT INTO concessions.combo (name, price) VALUES ('Cheap', -1);
              RAISE EXCEPTION 'a negative combo price was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a status outside the lifecycle
              INSERT INTO concessions.combo (name, price, status) VALUES ('Odd', 1, 'ACTIVE');
              RAISE EXCEPTION 'an unknown combo status was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- the same name, in another case, among active rows
              INSERT INTO concessions.combo (name, price) VALUES ('FAMILY', 1);
              RAISE EXCEPTION 'a duplicated active combo name was accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN  -- a zero quantity
              UPDATE concessions.combo_item SET quantity = 0 WHERE combo_id = c;
              RAISE EXCEPTION 'a zero quantity was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- the same product twice in one combo
              INSERT INTO concessions.combo_item (combo_id, product_id, quantity) VALUES (c, p, 1);
              RAISE EXCEPTION 'a repeated component was accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN  -- a component that is not a product
              INSERT INTO concessions.combo_item (combo_id, product_id, quantity) VALUES (c, gen_random_uuid(), 1);
              RAISE EXCEPTION 'a component of a product that does not exist was accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            BEGIN  -- a key that points to no combo
              INSERT INTO concessions.combo_idempotency_key (key, combo_id, request_hash)
                VALUES ('0123456789', gen_random_uuid(), 'h');
              RAISE EXCEPTION 'a key of a combo that does not exist was accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            BEGIN  -- a product used by a combo cannot be deleted
              DELETE FROM concessions.product WHERE id = p;
              RAISE EXCEPTION 'a product used by a combo was deleted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            DELETE FROM concessions.combo WHERE id = c;  -- the items go with it
            IF EXISTS (SELECT 1 FROM concessions.combo_item WHERE combo_id = c) THEN
              RAISE EXCEPTION 'the items of a deleted combo remained';
            END IF;
            DELETE FROM concessions.product WHERE id = p;
          END
          $$;
          SQL

          # The checks, key and foreign key of V010 and V011 (HU-CONCESSIONS-003): each invalid row is refused and
          # the application role can add and read movements but not change or delete them.
          sql <<'SQL'
          DO $$
          DECLARE p uuid;
          BEGIN
            INSERT INTO concessions.product (name, category, price) VALUES ('Stock base', 'SNACK', 10) RETURNING id INTO p;
            INSERT INTO concessions.stock_movement (product_id, quantity_delta, balance_after, movement_type, created_by)
              VALUES (p, 5, 5, 'RECEIPT', gen_random_uuid());
            BEGIN  -- a zero delta
              INSERT INTO concessions.stock_movement (product_id, quantity_delta, balance_after, movement_type, created_by)
                VALUES (p, 0, 5, 'ADJUSTMENT', gen_random_uuid());
              RAISE EXCEPTION 'a zero delta was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a negative balance
              INSERT INTO concessions.stock_movement (product_id, quantity_delta, balance_after, movement_type, created_by)
                VALUES (p, -9, -4, 'ADJUSTMENT', gen_random_uuid());
              RAISE EXCEPTION 'a negative balance was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a type outside the list
              INSERT INTO concessions.stock_movement (product_id, quantity_delta, balance_after, movement_type, created_by)
                VALUES (p, 1, 6, 'GIFT', gen_random_uuid());
              RAISE EXCEPTION 'an unknown movement type was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a key shorter than 8 characters
              INSERT INTO concessions.stock_movement (product_id, quantity_delta, balance_after, movement_type, idempotency_key, created_by)
                VALUES (p, 1, 6, 'RECEIPT', 'short', gen_random_uuid());
              RAISE EXCEPTION 'a short idempotency key was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            INSERT INTO concessions.stock_movement (product_id, quantity_delta, balance_after, movement_type, idempotency_key, created_by)
              VALUES (p, 1, 6, 'RECEIPT', '0123456789', gen_random_uuid());
            BEGIN  -- the same key twice
              INSERT INTO concessions.stock_movement (product_id, quantity_delta, balance_after, movement_type, idempotency_key, created_by)
                VALUES (p, 1, 7, 'RECEIPT', '0123456789', gen_random_uuid());
              RAISE EXCEPTION 'a repeated idempotency key was accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN  -- a movement of a product that does not exist
              INSERT INTO concessions.stock_movement (product_id, quantity_delta, balance_after, movement_type, created_by)
                VALUES (gen_random_uuid(), 1, 1, 'RECEIPT', gen_random_uuid());
              RAISE EXCEPTION 'a movement of a product that does not exist was accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            BEGIN  -- a product with history cannot be deleted
              DELETE FROM concessions.product WHERE id = p;
              RAISE EXCEPTION 'a product with stock movements was deleted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            -- The trail is immutable for the application: it reads and appends, nothing else.
            IF NOT has_table_privilege('concessions_writer', 'concessions.stock_movement', 'INSERT')
               OR has_table_privilege('concessions_writer', 'concessions.stock_movement', 'UPDATE')
               OR has_table_privilege('concessions_writer', 'concessions.stock_movement', 'DELETE') THEN
              RAISE EXCEPTION 'the writer role can change the stock movement trail';
            END IF;
            DELETE FROM concessions.stock_movement WHERE product_id = p;  -- the executor may clean up its test data
            DELETE FROM concessions.product WHERE id = p;
          END
          $$;
          SQL

          # The checks, keys, foreign keys and grants of V012 to V018 (HU-CONCESSIONS-004, ADR-045): each invalid row
          # is refused, one live order per reservation, and the roles can do only what the service needs.
          sql <<'SQL'
          DO $$
          DECLARE p uuid; o uuid; h uuid; u uuid := gen_random_uuid();
          BEGIN
            INSERT INTO concessions.product (name, category, price) VALUES ('Order base', 'SNACK', 10) RETURNING id INTO p;
            INSERT INTO concessions.concession_order (user_id, reservation_id, total_amount, status, idempotency_key, request_hash)
              VALUES (u, gen_random_uuid(), 100, 'RESERVED', '0123456789', 'h') RETURNING id INTO o;
            BEGIN  -- a negative total
              INSERT INTO concessions.concession_order (user_id, total_amount, status, idempotency_key, request_hash)
                VALUES (u, -1, 'RESERVED', 'abcdefghij', 'h');
              RAISE EXCEPTION 'a negative order total was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a status outside the lifecycle
              INSERT INTO concessions.concession_order (user_id, total_amount, status, idempotency_key, request_hash)
                VALUES (u, 1, 'PAID', 'abcdefghij', 'h');
              RAISE EXCEPTION 'an unknown order status was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a key shorter than 8 characters
              INSERT INTO concessions.concession_order (user_id, total_amount, status, idempotency_key, request_hash)
                VALUES (u, 1, 'RESERVED', 'short', 'h');
              RAISE EXCEPTION 'a short order key was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- the same key of the same user
              INSERT INTO concessions.concession_order (user_id, total_amount, status, idempotency_key, request_hash)
                VALUES (u, 1, 'RESERVED', '0123456789', 'h');
              RAISE EXCEPTION 'a repeated key of the same user was accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            -- the same key of another user is another order
            INSERT INTO concessions.concession_order (user_id, total_amount, status, idempotency_key, request_hash)
              VALUES (gen_random_uuid(), 1, 'RESERVED', '0123456789', 'h');
            BEGIN  -- a second live order for the same reservation
              INSERT INTO concessions.concession_order (user_id, reservation_id, total_amount, status, idempotency_key, request_hash)
                SELECT u, reservation_id, 1, 'RESERVED', 'klmnopqrst', 'h' FROM concessions.concession_order WHERE id = o;
              RAISE EXCEPTION 'two live orders for one reservation were accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            UPDATE concessions.concession_order SET status = 'CANCELLED' WHERE id = o;
            INSERT INTO concessions.concession_order (user_id, reservation_id, total_amount, status, idempotency_key, request_hash)
              SELECT u, reservation_id, 1, 'RESERVED', 'klmnopqrst', 'h' FROM concessions.concession_order WHERE id = o;  -- allowed once the first is CANCELLED
            INSERT INTO concessions.concession_order_item (order_id, item_type, item_id, item_name_snapshot, unit_price_snapshot, quantity)
              VALUES (o, 'PRODUCT', p, 'Order base', 10, 2);
            BEGIN  -- a zero quantity
              INSERT INTO concessions.concession_order_item (order_id, item_type, item_id, item_name_snapshot, unit_price_snapshot, quantity)
                VALUES (o, 'COMBO', gen_random_uuid(), 'Combo', 10, 0);
              RAISE EXCEPTION 'a zero item quantity was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a negative price snapshot
              INSERT INTO concessions.concession_order_item (order_id, item_type, item_id, item_name_snapshot, unit_price_snapshot, quantity)
                VALUES (o, 'COMBO', gen_random_uuid(), 'Combo', -1, 1);
              RAISE EXCEPTION 'a negative price snapshot was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- an item type outside the list
              INSERT INTO concessions.concession_order_item (order_id, item_type, item_id, item_name_snapshot, unit_price_snapshot, quantity)
                VALUES (o, 'DRINK', gen_random_uuid(), 'Drink', 1, 1);
              RAISE EXCEPTION 'an unknown item type was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- the same line twice
              INSERT INTO concessions.concession_order_item (order_id, item_type, item_id, item_name_snapshot, unit_price_snapshot, quantity)
                VALUES (o, 'PRODUCT', p, 'Order base', 10, 1);
              RAISE EXCEPTION 'a repeated order line was accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN  -- a line of an order that does not exist
              INSERT INTO concessions.concession_order_item (order_id, item_type, item_id, item_name_snapshot, unit_price_snapshot, quantity)
                VALUES (gen_random_uuid(), 'PRODUCT', p, 'Order base', 10, 1);
              RAISE EXCEPTION 'a line of an order that does not exist was accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            INSERT INTO concessions.stock_hold (order_id, status) VALUES (o, 'HELD') RETURNING id INTO h;
            BEGIN  -- a hold status outside the list
              UPDATE concessions.stock_hold SET status = 'EXPIRED' WHERE id = h;
              RAISE EXCEPTION 'an unknown hold status was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- a second hold for the same order
              INSERT INTO concessions.stock_hold (order_id, status) VALUES (o, 'HELD');
              RAISE EXCEPTION 'two holds for one order were accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN  -- a hold of an order that does not exist
              INSERT INTO concessions.stock_hold (order_id, status) VALUES (gen_random_uuid(), 'HELD');
              RAISE EXCEPTION 'a hold of an order that does not exist was accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            INSERT INTO concessions.stock_hold_item (hold_id, product_id, quantity) VALUES (h, p, 2);
            BEGIN  -- a zero quantity
              UPDATE concessions.stock_hold_item SET quantity = 0 WHERE hold_id = h;
              RAISE EXCEPTION 'a zero held quantity was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN  -- the same product twice in one hold
              INSERT INTO concessions.stock_hold_item (hold_id, product_id, quantity) VALUES (h, p, 1);
              RAISE EXCEPTION 'a repeated held product was accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN  -- a held product that does not exist
              INSERT INTO concessions.stock_hold_item (hold_id, product_id, quantity) VALUES (h, gen_random_uuid(), 1);
              RAISE EXCEPTION 'a held product that does not exist was accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            -- A reserve and its release leave movements that point at the order and the hold.
            INSERT INTO concessions.stock_movement (product_id, quantity_delta, balance_after, movement_type, created_by, order_id, hold_id)
              VALUES (p, -2, 0, 'RESERVE', u, o, h);
            BEGIN  -- a movement of an order that does not exist
              INSERT INTO concessions.stock_movement (product_id, quantity_delta, balance_after, movement_type, created_by, order_id)
                VALUES (p, -1, 0, 'RESERVE', u, gen_random_uuid());
              RAISE EXCEPTION 'a movement of an order that does not exist was accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            BEGIN  -- a movement of a hold that does not exist
              INSERT INTO concessions.stock_movement (product_id, quantity_delta, balance_after, movement_type, created_by, hold_id)
                VALUES (p, -1, 0, 'RESERVE', u, gen_random_uuid());
              RAISE EXCEPTION 'a movement of a hold that does not exist was accepted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            BEGIN  -- a product held by an order cannot be deleted
              DELETE FROM concessions.product WHERE id = p;
              RAISE EXCEPTION 'a product held by an order was deleted';
            EXCEPTION WHEN foreign_key_violation THEN NULL;
            END;
            -- The outbox: the writer appends and purges, never rewrites; csp-worker reads it and nothing else (ADR-019).
            INSERT INTO concessions.outbox_event (aggregate_type, aggregate_id, event_type, payload)
              VALUES ('ConcessionOrder', o, 'ConcessionStockReserved', '{}'::jsonb);
            IF NOT has_table_privilege('concessions_writer', 'concessions.outbox_event', 'INSERT')
               OR NOT has_table_privilege('concessions_writer', 'concessions.outbox_event', 'DELETE')
               OR has_table_privilege('concessions_writer', 'concessions.outbox_event', 'UPDATE') THEN
              RAISE EXCEPTION 'the writer role has the wrong privileges on the outbox';
            END IF;
            IF NOT has_table_privilege('concessions_outbox_reader', 'concessions.outbox_event', 'SELECT')
               OR has_table_privilege('concessions_outbox_reader', 'concessions.outbox_event', 'INSERT')
               OR has_table_privilege('concessions_outbox_reader', 'concessions.concession_order', 'SELECT') THEN
              RAISE EXCEPTION 'the outbox reader role has the wrong privileges';
            END IF;
            -- Orders and holds change status; their lines, snapshots and movements are append-only for the application.
            IF NOT has_table_privilege('concessions_writer', 'concessions.concession_order', 'UPDATE')
               OR has_table_privilege('concessions_writer', 'concessions.concession_order', 'DELETE')
               OR has_table_privilege('concessions_writer', 'concessions.concession_order_item', 'UPDATE')
               OR has_table_privilege('concessions_writer', 'concessions.stock_hold_item', 'UPDATE') THEN
              RAISE EXCEPTION 'the writer role has the wrong privileges on the order tables';
            END IF;
            -- Every foreign key of the schema has a complete index that starts with its columns (Annex A).
            IF EXISTS (
              SELECT 1 FROM pg_constraint c
              WHERE c.contype = 'f' AND c.connamespace = 'concessions'::regnamespace
                AND NOT EXISTS (
                  SELECT 1 FROM pg_index i
                  WHERE i.indrelid = c.conrelid AND i.indpred IS NULL
                    AND (string_to_array(i.indkey::text, ' '))[1:cardinality(c.conkey)] = string_to_array(array_to_string(c.conkey, ' '), ' '))) THEN
              RAISE EXCEPTION 'a foreign key of the concessions schema has no complete index';
            END IF;
            DELETE FROM concessions.outbox_event WHERE aggregate_id = o;
            DELETE FROM concessions.stock_movement WHERE product_id = p;
            DELETE FROM concessions.stock_hold_item WHERE hold_id = h;
            DELETE FROM concessions.stock_hold WHERE id = h;
            DELETE FROM concessions.concession_order_item WHERE order_id = o;
            DELETE FROM concessions.concession_order WHERE user_id IN (u) OR idempotency_key = '0123456789';
            DELETE FROM concessions.product WHERE id = p;
          END
          $$;
          SQL

          # U001 drops the whole schema, so it must refuse to run out of order: here the table still exists.
          if sql -f 05_rollbacks/01_ddl/01_schemas/U001__create_schema_concessions.sql; then
            echo "U001 ran with later objects still in the schema"; exit 1
          fi
          test "$(sql -tAc "select count(*) from pg_tables where schemaname = 'concessions'")" -gt 1 \
            || { echo "the refused U001 dropped something"; exit 1; }

          # Flyway Community does not undo. The rollback of each V<n> is U<n> in
          # 05_rollbacks/, applied here from the highest version down. The control
          # table lives in the schema (Annex J.6) and is dropped before U001.
          for f in $(find 05_rollbacks -name 'U*.sql' | awk -F/ '{print $NF" "$0}' | sort -r | cut -d' ' -f2); do
            case "$f" in
              # Every table is gone but the roles of V002 are not: U001 must still refuse.
              *U002__*) if sql -f 05_rollbacks/01_ddl/01_schemas/U001__create_schema_concessions.sql; then
                          echo "U001 ran with the roles of V002 still present"; exit 1
                        fi;;
              *U001__*) sql -c "DROP TABLE IF EXISTS concessions.flyway_schema_history";;
            esac
            echo "rollback $f"; sql -f "$f"
          done
          test "$(sql -tAc "select count(*) from pg_namespace where nspname = 'concessions'")" = 0 \
            || { echo "rollbacks left the schema behind"; exit 1; }
          test "$(sql -tAc "select count(*) from pg_roles where rolname in ('concessions_reader', 'concessions_writer', 'concessions_outbox_reader')")" = 0 \
            || { echo "rollbacks left roles behind"; exit 1; }

          fw migrate
          fw validate
